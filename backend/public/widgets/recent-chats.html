<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blink recent chats widget</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #000;
    color: #fff;
    padding: 12px;
    font-size: 13px;
  }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .head img { width: 20px; height: 20px; }
  .head b { font-size: 14px; }
  .badge {
    margin-left: auto; background: #fff; color: #000;
    font-size: 11px; font-weight: 700; border-radius: 999px;
    padding: 1px 8px;
  }
  .chat {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 4px; border-top: 1px solid rgba(255,255,255,.12);
    text-decoration: none; color: inherit;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 999px; flex: none;
    background: #333; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .meta { min-width: 0; flex: 1; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview { opacity: .65; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread {
    flex: none; min-width: 20px; height: 20px; border-radius: 999px;
    background: #fff; color: #000; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; padding: 0 6px;
  }
  .empty { opacity: .6; padding: 12px 0; text-align: center; }
</style>
</head>
<body>
  <div class="head">
    <img src="/blink.svg" alt="" />
    <b>Blink</b>
    <span class="badge" id="total" hidden></span>
  </div>
  <div id="list"><p class="empty">Loading…</p></div>
  <script>
    (async () => {
      const list = document.getElementById("list");
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
      const initials = (n) => (n || "?").trim().split(/\s+/).slice(0, 2)
        .map((w) => w[0] || "").join("").toUpperCase();
      try {
        const res = await fetch("/api/widgets/recent", { credentials: "include" });
        if (!res.ok) throw new Error("signed out");
        const data = await res.json();
        const total = document.getElementById("total");
        if (data.totalUnread > 0) {
          total.textContent = data.totalUnread > 99 ? "99+" : data.totalUnread;
          total.hidden = false;
        }
        if (!data.chats || data.chats.length === 0) {
          list.innerHTML = '<p class="empty">No recent chats.</p>';
          return;
        }
        list.innerHTML = data.chats.map((c) => {
          const u = c.user || {};
          const lm = c.lastMessage || {};
          const preview = lm.text || (lm.hasImage ? "📷 Photo" : lm.hasFile ? "📎 File" : "");
          const avatar = u.profilePic
            ? '<img src="' + esc(u.profilePic) + '" alt="" />'
            : esc(initials(u.fullName));
          return '<a class="chat" href="/">' +
            '<span class="avatar">' + avatar + "</span>" +
            '<span class="meta"><span class="name">' + esc(u.fullName || "Chat") + "</span><br/>" +
            '<span class="preview">' + (lm.fromMe ? "You: " : "") + esc(preview) + "</span></span>" +
            (c.unreadCount > 0 ? '<span class="unread">' + esc(c.unreadCount) + "</span>" : "") +
            "</a>";
        }).join("");
      } catch (e) {
        list.innerHTML = '<p class="empty">Open Blink to sign in.</p>';
      }
    })();
  </script>
</body>
</html>
